[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agents"
version = "0.1.0"
description = "Cross-harness catalog of agents and their workflows, with multi-level installation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agents", "workflows", "claude-code", "cline", "gemini-cli", "qwen-code"]
dependencies = ["click>=8.1"]

[project.scripts]
ai-agents = "ai_agents.cli:cli"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agents"]

# The agent catalog ships inside the wheel rather than being fetched at
# `init` time. `agents/` sits outside the package directory, so it has to be
# pulled in deliberately; it lands as `ai_agents/_catalog/`, which is what
# `cli._catalog_source()` reads. Reasoning is recorded in
# docs/design/2-catalog-distribution.md — briefly: `init` stays offline,
# and the catalog is version-locked to the hand-rolled frontmatter parser
# in `catalog.py` that has to read it.
[tool.hatch.build.targets.wheel.force-include]
"agents" = "ai_agents/_catalog"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "agents",
    "harness-adapters",
    "docs",
    "*.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
