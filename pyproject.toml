[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agents"
version = "0.1.0"
description = "Cross-harness catalog of agents and their workflows, with multi-level installation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agents", "workflows", "claude-code", "cline", "gemini-cli", "qwen-code"]
dependencies = ["click>=8.1"]

[project.scripts]
ai-agents = "ai_agents.cli:cli"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
