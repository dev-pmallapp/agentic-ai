name: CI

# Task #47. Three independent jobs, because they fail for different reasons:
# `tests` catches broken Python, `catalog` catches broken *content* (a
# malformed AGENT.md header breaks `ai-agents list` without touching any
# Python, and the unit suite passes right through it), and `package` catches
# a distribution that builds but does not carry the catalog it is supposed
# to ship.

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR cancels the first run rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Every version runs even after one fails — knowing it is 3.10-only
      # is worth more than failing fast.
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.10". Every version from
        # that floor to current is tested, so the claim has evidence behind
        # it rather than being a promise nothing runs on.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pytest>=8.0"

      - name: Run tests
        run: pytest -q

  catalog:
    name: catalog parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No install step and no dependencies: the check adds src/ to sys.path
      # itself and imports only `ai_agents.catalog`, which is pure stdlib.
      # Keeping it independent of the package install is deliberate — this
      # job should be able to fail when installation is what broke.
      - name: Check the agent catalog
        run: python .github/scripts/check_catalog.py

  package:
    name: wheel ships the catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      # The regression guard for #45. `init` on a non-editable install reads
      # the catalog force-included into the wheel; if that force-include is
      # ever dropped, everything else here still passes and only a user
      # without a checkout finds out. So: install the built wheel somewhere
      # that is neither the checkout nor a git repo, and seed from it.
      - name: Install the wheel and seed from it, outside any checkout
        run: |
          set -euo pipefail
          python -m venv /tmp/probe-venv
          /tmp/probe-venv/bin/pip install --quiet dist/*.whl
          mkdir -p /tmp/probe-home /tmp/probe-elsewhere
          cd /tmp/probe-elsewhere
          HOME=/tmp/probe-home /tmp/probe-venv/bin/ai-agents init
          HOME=/tmp/probe-home /tmp/probe-venv/bin/ai-agents list | tee /tmp/probe-list.txt
          # `list` exits 0 on an empty catalog, so assert on content, not status.
          grep -q "stock-screening" /tmp/probe-list.txt
